name: AutoRepair acceptance
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "ci/**"
      - "autorepair-ai-hosting-beta-*.zip"
      - ".github/workflows/acceptance.yml"
      - "central-service/**"
  workflow_dispatch:
    inputs:
      stripe_sandbox:
        description: 'Run Stripe sandbox API tests (requires STRIPE_TEST_SECRET_KEY)'
        type: boolean
        default: false
      load_test:
        description: 'Run central-service load characterization (measurement only, not pass/fail)'
        type: boolean
        default: false
  schedule:
    # 毎週月曜 03:00 UTC（= 月曜 12:00 JST）
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run central metering and Stripe safety tests
        run: python3 central-service/test_service.py
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run plugin unit tests (isolated WP stubs, no Docker/MySQL)
        run: |
          mkdir -p /tmp/aaihb-unit
          plugin_zip="$(find . -maxdepth 1 -name 'autorepair-ai-hosting-beta-*.zip' -printf '%f\n' | sort -V | tail -n 1)"
          test -n "$plugin_zip"
          unzip -q "$plugin_zip" -d /tmp/aaihb-unit
          cat > /tmp/aaihb-wp-stubs.php <<'STUBS'
          <?php
          // WordPress gettext functions the plugin calls but tests/contracts.php
          // does not stub. Prepended so the isolated harness can run.
          if (!function_exists('__')) { function __($s, $d = null) { return $s; } }
          if (!function_exists('_e')) { function _e($s, $d = null) { echo $s; } }
          if (!function_exists('esc_html__')) { function esc_html__($s, $d = null) { return $s; } }
          if (!function_exists('esc_attr__')) { function esc_attr__($s, $d = null) { return $s; } }
          if (!function_exists('esc_html_e')) { function esc_html_e($s, $d = null) { echo $s; } }
          if (!function_exists('esc_attr_e')) { function esc_attr_e($s, $d = null) { echo $s; } }
          if (!function_exists('_x')) { function _x($s, $c, $d = null) { return $s; } }
          if (!function_exists('_n')) { function _n($s, $p, $n, $d = null) { return $n == 1 ? $s : $p; } }
          if (!function_exists('_nx')) { function _nx($s, $p, $n, $c, $d = null) { return $n == 1 ? $s : $p; } }
          STUBS
          php -d auto_prepend_file=/tmp/aaihb-wp-stubs.php /tmp/aaihb-unit/autorepair-ai-hosting-beta/tests/contracts.php
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - db_image: mysql:8.4
            label: mysql-8.4
          - db_image: mariadb:10.5
            label: mariadb-10.5
    steps:
      - uses: actions/checkout@v4
      - name: Run real Docker + MySQL rehearsal
        env:
          AAIHB_DB_IMAGE: ${{ matrix.db_image }}
        run: python3 ci/e2e.py
      - name: Save test evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-evidence-${{ matrix.label }}
          path: reports/
          retention-days: 7
  stripe:
    if: ${{ github.event_name == 'schedule' || inputs.stripe_sandbox }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Stripe test key is configured
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: |
          if [ -z "$STRIPE_TEST_SECRET_KEY" ]; then
            echo "::error::STRIPE_TEST_SECRET_KEY が未登録です。Settings → Secrets and variables → Actions で登録してください。"
            exit 1
          fi
          case "$STRIPE_TEST_SECRET_KEY" in
            sk_test_*) echo "テストキーを確認しました。" ;;
            sk_live_*) echo "::error::本番キー(sk_live_)が設定されています。テストキー(sk_test_)に置き換えてください。"; exit 1 ;;
            *) echo "::error::キー形式が不正です（sk_test_ で始まる必要があります）。"; exit 1 ;;
          esac
      - name: Stripe sandbox success and decline
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: python3 ci/stripe_sandbox.py
      - name: Central-service Stripe HTTP routes (checkout, webhook, portal, usage sync)
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: python3 ci/stripe_central_service.py
      - name: Save sandbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stripe-evidence
          path: reports/
          retention-days: 7
  load:
    if: ${{ github.event_name == 'schedule' || inputs.load_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Central-service load characterization
        run: python3 ci/load_test.py
      - name: Save load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-evidence
          path: reports/
          retention-days: 7
  rate-limit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run central-service rate limiter regression
        run: python3 ci/rate_limit_test.py
  verification-summary:
    if: always()
    needs: [central, unit, restore, stripe, load, rate-limit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CENTRAL_RESULT: ${{ needs.central.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      RESTORE_RESULT: ${{ needs.restore.result }}
      STRIPE_RESULT: ${{ needs.stripe.result }}
      LOAD_RESULT: ${{ needs.load.result }}
      RATE_LIMIT_RESULT: ${{ needs.rate-limit.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Build verification summary
        run: python3 ci/verification_summary.py
      - name: Save verification summary
        uses: actions/upload-artifact@v4
        with:
          name: verification-summary
          path: reports/verification-summary.json
          retention-days: 30
